name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every gate is its own step, so a red run names the rule that broke
      # rather than one opaque command. This list mirrors CONSTRAINTS.md,
      # which is the canonical record of the bar; if the two drift, that
      # file wins.
      - name: Secret, identity and artifact audit
        run: |
          python3 tests/check-secrets.py --self-test
          python3 tests/check-secrets.py

      - name: Image audit (metadata and pixels)
        run: |
          # Pillow is REQUIRED, not optional: without it the audit cannot read
          # compressed zTXt/iTXt PNG chunks or EXIF, and the audit REFUSES to
          # report rather than fail open on a credential-bearing image.
          #
          # Install it with pip, into the interpreter that actually runs the
          # audit. `apt-get install python3-pil` puts Pillow in the SYSTEM
          # Debian Python's dist-packages, but actions/setup-python@v5 puts a
          # hosted 3.12 first on PATH — so the apt package was invisible and the
          # gate correctly refused with exit 2. That is why this step failed in
          # CI while passing locally.
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          python3 -m pip install --quiet "Pillow==11.*"
          # Prove the interpreter that runs the audit can actually see it,
          # rather than assuming the install worked.
          python3 -c "import PIL, sys; print('Pillow', PIL.__version__, 'for', sys.executable)"
          python3 tests/check-image-safety.py --self-test
          mapfile -t IMAGES < <(git ls-files | grep -iE '\.(png|jpe?g|webp|avif|gif)$')
          if [ "${#IMAGES[@]}" -gt 0 ]; then
            python3 tests/check-image-safety.py "${IMAGES[@]}"
          else
            echo "no tracked images"
          fi

      - name: Image audit logic tests
        run: python3 tests/test_image_audit.py

      - name: DeckState JS helper tests
        run: node tests/test_deckstate.js

      - name: Collector behavioral tests
        run: python3 tests/test_collect.py

      - name: Action dispatcher tests
        run: python3 tests/test_act.py

      - name: QML plain-text floor
        run: python3 tests/check-qml-plaintext.py .

      - name: Tree hygiene and manifest contract
        run: bash tests/check-tree.sh .

      - name: Syntax checks
        run: |
          bash -n scripts/deck-act
          python3 -m py_compile scripts/deck-collect
          python3 -m py_compile tests/check-qml-plaintext.py
          python3 -m py_compile tests/check-secrets.py

  # The scanner that actually decides a marketplace submission, run from the
  # marketplace's own repository rather than a local approximation of it.
  # It encodes rules this project did not write, which is the only kind of
  # constraint a project's own tests cannot satisfy by agreeing with itself.
  marketplace-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the marketplace validator
        run: |
          git clone --depth 1 \
            https://github.com/omacom/omarchy-plugin-marketplace.git /tmp/marketplace
          npm ci --prefix /tmp/marketplace

      - name: Run the canonical security baseline
        run: |
          cat > /tmp/baseline.mjs <<'EOF'
          import { runSecurityBaseline } from "/tmp/marketplace/scripts/security-baseline-scanner.mjs";
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const report = await runSecurityBaseline(`https://github.com/${repo}`, sha, {});
          console.log(`outcome:      ${report.outcome}`);
          console.log(`disposition:  ${report.disposition}`);
          console.log(`blocksApproval: ${report.blocksApproval}`);
          for (const f of report.findings ?? []) {
            console.log(`finding: ${f.id} ${f.path ?? ""} ${f.line ?? ""}`);
          }
          for (const c of report.capabilities ?? []) {
            console.log(`capability: ${c.id} (${c.evidence?.length ?? 0} evidence row(s))`);
          }
          if (report.blocksApproval) {
            console.error("the canonical baseline blocks approval");
            process.exit(1);
          }
          EOF
          node /tmp/baseline.mjs
